<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="color-scheme" content="light">
    <title>{{ subject }}</title>

    <style type="text/css" rel="stylesheet" media="all">
        @media only screen and (max-width: 560px) {
            .card { padding: 24px !important; }
            .button { display: block !important; text-align: center !important; }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; width: 100%; background-color: #f4f5f7; -webkit-font-smoothing: antialiased;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color: #f4f5f7;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width: 560px; margin: 0 auto;">
                    <tr>
                        <td style="padding-bottom: 20px;">
                            <a href="{{ brand_url }}" target="_blank" style="text-decoration: none;">{{ brand_mark }}</a>
                        </td>
                    </tr>

                    <tr>
                        <td class="card" style="background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            {{ content }}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 20px 4px 0; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.6; color: #9ca3af;">
                            Sent by {{ brand_name }}. You are receiving this because there is an account here with this address.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
